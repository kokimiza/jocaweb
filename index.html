<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="jocarium（ヨカリウム）のホームページ。映像・ゲーム・音楽・技術。">
  <title>jocarium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&display=swap">
  <link rel="stylesheet" href="./assets/css/reset.css">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/layout.css">
  <link rel="stylesheet" href="./assets/css/theme.css">
  <link rel="stylesheet" href="./assets/css/retro.css">
  <script src="./assets/js/config.js" defer></script>
  <script src="./assets/js/components.js" defer></script>
  <script src="./assets/js/main.js" defer></script>
  <script src="./assets/js/i18n.js" defer></script>
</head>
<body data-page="index">
  <site-header base="."></site-header>
  <main id="main" tabindex="-1">
    <section class="flyer-hero" aria-labelledby="slogan">
      <div class="container">
        <p class="homepage-welcome" data-i18n="retro.welcome">ようこそ！jocarium のホームページへ！</p>
        <div class="hero-stage">
          <h1 class="hero-title" id="slogan" lang="ja">握る！</h1>
          <img class="grip-clipart" src="./assets/icons/grip.svg" width="280" height="290" alt="">
        </div>
        <div class="grip-console" hidden>
          <label for="grip-count" data-i18n="retro.counter">このブラウザで握った回数</label>
          <output class="grip-count" id="grip-count" aria-live="off">0000000</output>
          <button type="button" class="grip-button" data-i18n="retro.grip">握ってみる！</button>
          <span class="grip-console-message" aria-live="polite"></span>
        </div>
      </div>
    </section>
    <section class="values" aria-labelledby="values-heading">
      <div class="container">
        <div class="section-title"><h2 id="values-heading" data-i18n="sections.philosophy">大切にしていること</h2></div>
        <ul class="values-list">
          <li class="values-item"><span class="values-mark" aria-hidden="true">智</span><h3 data-i18n="index.values.wisdom.desc">智を修飾する</h3></li>
          <li class="values-item"><span class="values-mark" aria-hidden="true">才</span><h3 data-i18n="index.values.spark.desc">才気煥発</h3></li>
          <li class="values-item"><span class="values-mark" aria-hidden="true">徳</span><h3 data-i18n="index.values.virtue.desc">非合理に宿る美徳を涵養する</h3></li>
        </ul>
      </div>
    </section>
    <section class="brands" id="brands" aria-labelledby="brands-heading">
      <div class="container">
        <div class="section-title"><h2 id="brands-heading" data-i18n="index.brands.label">ブランド一覧</h2></div>
        <table class="brand-table">
          <thead><tr><th scope="col" data-i18n="index.brands.colType">分野</th><th scope="col" data-i18n="index.brands.colName">名前</th></tr></thead>
          <tbody>
            <tr><td data-i18n="index.brands.kokimiza.type">映像・アニメーション</td><td><a href="./kokimiza/index.html">kokimiza</a></td></tr>
            <tr><td data-i18n="index.brands.gutzgutz.type">ゲーム開発</td><td><a href="./gutzgutz/index.html">Gutzgutz</a></td></tr>
            <tr><td data-i18n="index.brands.bpm.type">音楽レーベル</td><td><a href="./bpm/index.html">Burning Pizza Methods</a></td></tr>
            <tr><td data-i18n="index.brands.systems.type">ソフトウェア・技術基盤</td><td><a href="./systems/index.html">jocarium Systems</a></td></tr>
            <tr><td data-i18n="index.brands.namaran.type">Webサービス（運営：jocarium Systems）</td><td><a href="https://namaran.jocarium.productions/">Namaran</a></td></tr>
          </tbody>
        </table>
      </div>
    </section>
    <div class="cta">
      <div class="container">
        <div class="cta-buttons"><a href="./press/index.html" class="btn btn-primary" data-i18n="shared.press">お知らせ</a><a href="./contact/index.html" class="btn btn-secondary" data-i18n="shared.getInTouch">お問い合わせ</a></div>
      </div>
    </div>
  </main>
  <site-footer base="."></site-footer>
</body>
</html>
